# CodeRabbit Configuration for Techfest 30 Living Atlas (3D-CA-IITB)
# Reference: https://docs.coderabbit.ai/guides/configure-coderabbit

version: "2"
language: "en-US"
tone_instructions: "Rigorous, constructive, performance-focused, and accessibility-aware."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true

path_filters:
  - "!dist/**"
  - "!node_modules/**"
  - "!test-results/**"
  - "!QA/evidence/**"
  - "!public/hdri/**"
  - "!public/models/**"

knowledge_base:
  opt_out: false
  learnings:
    scope: "local"

plugins:
  typescript:
    enabled: true
  react:
    enabled: true
